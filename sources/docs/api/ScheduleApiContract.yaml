        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: Text content of the post
        scheduledTime:
          type: string
          format: date-time
          description: Planned publishing timestamp in ISO-8601 format

    ScheduleResponseDto:
      type: object
      properties:
        scheduleId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tenantId:
          type: string
        platform:
          type: string
        content:
          type: string
        scheduledTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, SENT, FAILED, CANCELLED]
        retryCount:
          type: integer

    ValidationErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: "VALIDATION_FAILED"
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
