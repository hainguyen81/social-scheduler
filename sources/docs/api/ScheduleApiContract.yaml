## 2. Enterprise Security Architecture & OWASP Compliance

### 2.1. Security Scheme & RBAC Hierarchy Mapping
The API Gateway (`org.nlh4j.socialscheduler.gateway`) intercepts all incoming HTTP requests to `/api/v1/**` and validates the RS256-signed JSON Web Token (JWT) provided in the `Authorization: Bearer <token>` header. 
- **[ARC-001] (Admin Role):** Grants unrestricted administrative capabilities across all tenant boundaries and resource endpoints.
- **[ARC-002] (User Role):** Grants standard tenant user privileges to create, read, and delete their own publishing schedules.
- **[ARC-003] (Scheduler Role):** Grants execution workers and scheduler services permission to update publishing status (`SENT`, `FAILED`).
- **[ARC-004] (Analyst Role):** Grants read-only access to analytics and performance metrics endpoints.

### 2.2. Token Lifecycle & Refresh Flow (`auth-service`)
When an access token expires, the client receives a `401 Unauthorized` response with error code `TOKEN_EXPIRED`. 
1. **Client Action:** The client invokes `POST /api/v1/auth/token/refresh` with a valid, non-revoked refresh token stored securely via `@capacitor/preferences` (on mobile clients) or HTTP-only cookies (on web clients).
2. **Server Action (`auth-service`):** Validates the refresh token against Redis session store, checks revocation status, and issues a new short-lived JWT access token (TTL: 15 minutes) along with a rotated refresh token.
3. **Exception Handling:** If the refresh token is expired or invalid, `auth-service` responds with `401 Unauthorized` (`TOKEN_INVALID`), forcing the user to re-authenticate.

### 2.3. OWASP Top 10 Mitigation Summary ([ARC-006])
- **A01:2021 - Broken Access Control:** Enforced via Spring Security 6 RBAC method security (`@PreAuthorize`) and schema-per-tenant isolation at the persistence layer.
- **A02:2021 - Cryptographic Failures:** All data in transit is encrypted using TLS 1.3 with strict HSTS headers. JWT signatures are verified using public/private key pairs (RS256).
- **A07:2021 - Identification and Authentication Failures:** Implements robust token expiration policies, secure token rotation, and rate-limiting on authentication endpoints to prevent brute-force attacks.

