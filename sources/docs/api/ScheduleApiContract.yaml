    secure token handling, and strict OWASP Top 10 compliance ([ARC-005], [ARC-006]).
    
    ## RBAC Enforcement Matrix ([ARC-001] - [ARC-004])
    | Endpoint / Operation | HTTP Method | Allowed Roles | Description |
    | :--- | :--- | :--- | :--- |
    | `/api/v1/schedules` | POST | ADMIN, USER, SCHEDULER | Create a new publishing schedule item |
    | `/api/v1/schedules/{id}` | GET | ADMIN, USER, ANALYST | Retrieve publishing schedule details |
    | `/api/v1/schedules/{id}/status` | PUT | ADMIN, SCHEDULER | Update publishing status (e.g. SENT, FAILED) |
    | `/api/v1/schedules/{id}` | DELETE | ADMIN, USER | Cancel and delete an existing schedule item |

servers:
