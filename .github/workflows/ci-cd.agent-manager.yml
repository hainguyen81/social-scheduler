# ==============================================================================
# 🏢 ENTERPRISE MULTI-AGENT DEVELOPMENT LIFECYCLE ORCHESTRATOR
# ==============================================================================
# Fully compliant with strict multi-tenant isolation, cross-channel notification architecture,
# dynamic gym-style subscription tracking constraints, and automated token-saving micro-steps.
# Directs parallel standalone executions or sequential cron schedules seamlessly.
# ==============================================================================

name: "🏢 Enterprise Project AI Agents Management"

on:
  schedule:
    # - cron: '0 0 * * *' # 🕒 Automated daily scheduler trigger executed exactly at 00:00 UTC
    
    # Automated every 2 hours (0h, 6h, 12h, 18h UTC GMT+0).
    # Should use more several minutes to avoid delay;
    # because GitHub Shared Schedule Queue for many repositories on the world
    - cron: '12 */2 * * *'
  
  workflow_dispatch:
    inputs:
      execution_mode:
        description: '🎯 Execution Mode Selection'
        required: true
        default: '🕒🔄📅 Auto Schedule'
        type: choice
        options:
          - '🕒🔄📅 Auto Schedule'     # 🚀 Executes the full multi-agent sequence or advances standard cron timeline
          - '🏝️🔒⚙️ Standalone'  # 🧩 Triggers a SINGLE sub-agent targeting an isolated day/phase partition
      target_scope:
        description: '📅 Target Scope Configuration (Day or Phase focused)'
        required: true
        default: '🗓️ By Day'
        type: choice
        options:
          - '🗓️ By Day'            # 📆 Evaluates structural execution matrices using specific target Day number
          - '🌗 By Phase'          # 🗂️ Evaluates structural execution matrices using specific target Phase number
      input_value:
        description: '⏱️ Enter Day number (1-24) OR Phase number (1-4). Leave EMPTY for Auto-Advance.'
        required: false
        type: string
        default: ''
      agent_target:
        description: '🧩 IF standalone_agent mode is active, select the target operational Sub-Agent:'
        required: false
        default: '🚫 None'
        type: choice
        options:
          - '🚫 None'
          - '🤖💻 Coder'
          - '🤖🔍 Tester'
          - '🤖🐛 Reviewer'
          - '🤖📚 Technical Document Writer'
          - '🤖🐋 Docker DevOps'
          - '🤖☁️ GCP DevOps'
          - '🤖☸ ️GKE DevOps'
      release_flag:
        description: '📢 Enable Release Flag (Activates infrastructure Agents: Docker, GCP, GKE)'
        required: false
        type: boolean
        default: false

# permissions for GitHub Actions READ/WRITE
permissions:
  contents: write
  packages: write
  id-token: write

# enviroment
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'

jobs:
  # ==============================================================================
  # JOB 1: STATE RESOLVER, COMPLIANCE GIT ISOLATION, AND GATEKEEPER
  # ==============================================================================
  state_resolver_job:
    name: "🗄️ State Resolver & Git Isolation Gatekeeper"
    runs-on: ubuntu-latest
    
    outputs:
      phase_ended: ${{ steps.resolver.outputs.phase_ended }}
      run_day: ${{ steps.resolver.outputs.run_day }}
      run_phase: ${{ steps.resolver.outputs.run_phase }}
      total_phases: ${{ steps.resolver.outputs.total_phases }}
      total_days: ${{ steps.resolver.outputs.total_days }}
      exec_mode: ${{ steps.resolver.outputs.exec_mode == 'auto_cron' && 'auto_cron' || 'manual' }}
      agent_target: >-
        ${{ 
          inputs.agent_target == '🤖💻 Coder' && 'coder' ||
          inputs.agent_target == '🤖🔍 Tester' && 'tester' ||
          inputs.agent_target == '🤖🐛 Reviewer' && 'reviewer' ||
          inputs.agent_target == '🤖📚 Technical Document Writer' && 'doc' ||
          inputs.agent_target == '🤖🐋 Docker DevOps' && 'docker' ||
          inputs.agent_target == '🤖☁️ GCP DevOps' && 'gcp' ||
          inputs.agent_target == '🤖☸ ️GKE DevOps' && 'gke' ||
          'none' 
        }}
      release_flag: ${{ inputs.release_flag || 'false' }}
    
    steps:
      # Block 1.1: Administrative gate check protecting centralized production ecosystems
      - name: "🛡️ Gatekeeper - Validate Administrative Execution Tokens"
        env:
          ALLOW_AGENTS: ${{ secrets.ALLOW_AGENTS }}
        if: ${{ env.ALLOW_AGENTS != 'true' }}
        run: |
          echo "❌ [ADMIN REJECTION] Deployment is administratively DISABLED via GitHub Secrets configuration."
          echo "Terminating workflow execution thread immediately to secure staging cloud clusters."
          exit 1
      
      # Block 1.2: Shallow checkout mapping baseline code repository trees into runner memory spaces
      - name: "📦 Fetch Core Codebase Repository Assets"
        uses: actions/checkout@v7
        with:
          path: '.'
          fetch-depth: 0
          clean: true
      
      # Block 1.2.1: Debug project check-out structure
      - name: "⚙️ Config $PROJECT_WORKSPACE enviroment after checking out"
        id: project-workspace
        run: |
          CURRENT_PWD=$(pwd)
          echo "PROJECT_WORKSPACE=$CURRENT_PWD" >> $GITHUB_ENV
          echo "project_workspace=$CURRENT_PWD" >> $GITHUB_OUTPUT
          echo "⚙️ >> PROJECT_WORKSPACE: $CURRENT_PWD"
          
          # Debug step: Verify files exist physically in the workspace console log before AI execution path starts
          echo "🐛 [DEBUG] Auditing active workspace files presence (../../):"
          ls -la ../../
          echo "🐛 [DEBUG] Auditing active workspace files presence (../):"
          ls -la ../
          echo "🐛 [DEBUG] Auditing active workspace files presence (./):"
          ls -la ./
          echo "🐛 [DEBUG] Auditing active workspace files presence (membership-hub/):"
          if [ -d "membership-hub" ]; then ls -la membership-hub/; fi
          echo "🐛 [DEBUG] Auditing active workspace files presence (.ai/):"
          if [ -d ".ai" ]; then ls -la .ai/; fi
          
          echo "🔍 [ CHECKPOINT ] Check files on branch with commit status:"
          git status || true
      
      # Block 1.3: Inject secure global environment parameters and service boundaries
      - name: "🔧 [ features/development ] Configure Machine Git Automation Credentials"
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          # Pull all commits from sub-agents
          git pull origin "features/development" --rebase || true
      
      # Block 1.4: Core State Machine execution manipulating temporal parameters and daily isolated branch forks
      - name: "🗄️ [ features/development ] Execute Pipeline Parameters Resolution and Git Fork Compliance"
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        run: |
          # 🚀 HARD RESET & WIPE LOCAL CACHE: Vaporize ALL untracked, ignored, and phantom cached indexing files instantly
          git reset --hard HEAD
          git clean -ffdx
          
          BRANCH_NAME="features/development"
          echo "- Checkout branch: $BRANCH_NAME"
          
          # Initialize independent sub-branch tracking layer cleanly
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME" || git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            echo "🌿 [GIT ALREADY EXISTS] Target daily workspace branch detected. Shifting contexts..."
            # Wipe again right before shifting to the existing target daily development branch
            git checkout -f "$BRANCH_NAME"
            
            echo "- Merge master to $BRANCH_NAME"
            git merge origin/master --no-ff -m "ci: auto-merge master into $BRANCH_NAME [skip ci]"
          else
            echo "🚀 [GIT BRANCH FORK] Provisioning pristine branch [$BRANCH_NAME] initialized from stable trunk root [features/development]"
            git checkout -f -b "$BRANCH_NAME"
          fi
          
          echo "- Commit/Push changes from master to $BRANCH_NAME"
          git push origin $BRANCH_NAME
      
      # Block 1.5: Core State Machine execution manipulating temporal parameters and daily isolated branch forks
      - name: "🗄️ [ features/development-phase-X-day-Y ] Execute Pipeline Parameters Resolution and Git Fork Compliance"
        id: resolver
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        env:
          # specify root path to load modules
          PROJECT_WORKSPACE: ${{ env.PROJECT_WORKSPACE }}
          PYTHONPATH: ${{ env.PROJECT_WORKSPACE }}
          
          # specify agents folder path to load by `.libs/project_agents_package_loader.py`
          AGENTS_PACKAGE_PATH: ${{ env.PROJECT_WORKSPACE }}/.ai
          
          # inputted values
          TRIGGER_EVENT: ${{ github.event_name }}
          INPUT_EXEC_MODE: ${{ inputs.execution_mode == '🕒🔄📅 Auto Schedule' && 'auto_cron' || 'manual' }}
          INPUT_TARGET_SCOPE: ${{ inputs.target_scope == '🗓️ By Day' && 'by_day' || 'by_phase' }}
          INPUT_VALUE: ${{ inputs.input_value }}
        run: |
          # 🔑 grant permissions to run state resolver scripts
          chmod +x .github/scripts/ci-cd.agent-manager.state-resolver.py
          chmod +x .github/scripts/ci-cd.agent-manager.state-resolver.sh
          
          # 🚀 execute script to resolve running state
          ./.github/scripts/ci-cd.agent-manager.state-resolver.sh
  
  # ==============================================================================
  # JOBS 2-8: DYNAMIC REUSABLE SUB-AGENT DEPLOYMENT MAPPINGS
  # ==============================================================================
  run_coder:
    name: "👩‍💻 Coder Agent Worker"
    needs: state_resolver_job
    if: |
      needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || 
      (needs.state_resolver_job.outputs.exec_mode != 'auto_cron' && needs.state_resolver_job.outputs.agent_target == 'coder')
    uses: ./.github/workflows/ci-cd.agent-coder.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  run_tester:
    name: "👩‍🐞 Tester Agent Worker"
    needs: [state_resolver_job, run_coder]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.run_coder.result == 'success' || needs.run_coder.result == 'skipped') &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || needs.state_resolver_job.outputs.agent_target == 'tester')
    uses: ./.github/workflows/ci-cd.agent-tester.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  run_fixer:
    name: "👩‍🔧 Fixer Agent Worker"
    needs: [state_resolver_job, run_tester]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.run_coder.result == 'success' || needs.run_coder.result == 'skipped') &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || needs.state_resolver_job.outputs.agent_target == 'reviewer')
    uses: ./.github/workflows/ci-cd.agent-fixer.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  run_doc:
    name: "📝 Documentation Agent Worker"
    needs: [state_resolver_job, run_fixer]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.run_coder.result == 'success' || needs.run_coder.result == 'skipped') &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || needs.state_resolver_job.outputs.agent_target == 'doc')
    uses: ./.github/workflows/ci-cd.agent-doc.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  run_dockerhub:
    name: "🐳 DockerHub Agent Worker"
    needs: [state_resolver_job, run_gcp]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.run_doc.result == 'success' || needs.run_doc.result == 'skipped') &&
      needs.state_resolver_job.outputs.release_flag == 'true' &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || needs.state_resolver_job.outputs.agent_target == 'docker')
    uses: ./.github/workflows/ci-cd.agent-dockerhub.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  run_gcp:
    name: "☁️ GCP GAR Agent Worker"
    needs: [state_resolver_job, run_doc]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.run_doc.result == 'success' || needs.run_doc.result == 'skipped') &&
      needs.state_resolver_job.outputs.release_flag == 'true' &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || needs.state_resolver_job.outputs.agent_target == 'gcp')
    uses: ./.github/workflows/ci-cd.agent-gcp.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  run_gke:
    name: "☸️ GKE Deployment Agent Worker"
    needs: [state_resolver_job, run_dockerhub]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.run_doc.result == 'success' || needs.run_doc.result == 'skipped') &&
      needs.state_resolver_job.outputs.release_flag == 'true' &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron' || needs.state_resolver_job.outputs.agent_target == 'gke')
    uses: ./.github/workflows/ci-cd.agent-gke.yml
    with:
      phase: ${{ needs.state_resolver_job.outputs.run_phase }}
      day: ${{ needs.state_resolver_job.outputs.run_day }}
    secrets: inherit
  
  # ==============================================================================
  # JOB 9: AUTOMATED DAILY ADVANCED TIMELINE GATE & PUSH WORKFLOW
  # ==============================================================================
  advance_schedule_tracker:
    name: "📅 Post-Execution Upstream Integration Gate"
    needs: [state_resolver_job, run_coder, run_tester, run_fixer, run_doc]
    if: |
      (needs.state_resolver_job.result == 'success') &&
      (needs.state_resolver_job.outputs.exec_mode == 'auto_cron') &&
      (needs.run_coder.result == 'success' || needs.run_coder.result == 'skipped') &&
      (needs.run_tester.result == 'success' || needs.run_tester.result == 'skipped') &&
      (needs.run_fixer.result == 'success' || needs.run_fixer.result == 'skipped') &&
      (needs.run_doc.result == 'success' || needs.run_doc.result == 'skipped')
    runs-on: ubuntu-latest
    
    steps:
      # Administrative gate check protecting centralized production ecosystems
      - name: "🛡️ Gatekeeper - Validate Administrative Execution Tokens"
        env:
          ALLOW_AGENTS: ${{ secrets.ALLOW_AGENTS }}
        if: ${{ env.ALLOW_AGENTS != 'true' }}
        run: |
          echo "❌ [ADMIN REJECTION] Deployment is administratively DISABLED via GitHub Secrets configuration."
          echo "Terminating workflow execution thread immediately to secure staging cloud clusters."
          exit 1
      
      # Block 9.1: Ensure we are targeting the newly customized standalone daily branch code states
      - name: "📦 Synchronize Active Daily Target Workspace Branch"
        uses: actions/checkout@v7
        with:
          ref: "features/development"
          path: '.'
          fetch-depth: 0
          clean: true
      
      # Block 9.1.1: Debug project check-out structure
      - name: "⚙️ Config $PROJECT_WORKSPACE enviroment after checking out"
        id: project-workspace
        run: |
          echo "PROJECT_WORKSPACE=$(pwd)" >> $GITHUB_ENV
          echo "project_workspace=$(pwd)" >> $GITHUB_OUTPUT
          echo "⚙️ >> PROJECT_WORKSPACE: ${{ env.PROJECT_WORKSPACE }}"
          
          # Debug step: Verify files exist physically in the workspace console log before AI execution path starts
          echo "🐛 [DEBUG] Auditing active workspace files presence (../../):"
          ls -la ../../
          echo "🐛 [DEBUG] Auditing active workspace files presence (../):"
          ls -la ../
          echo "🐛 [DEBUG] Auditing active workspace files presence (./):"
          ls -la ./
          echo "🐛 [DEBUG] Auditing active workspace files presence (membership-hub/):"
          if [ -d "membership-hub" ]; then ls -la membership-hub/; fi
          echo "🐛 [DEBUG] Auditing active workspace files presence (.ai/):"
          if [ -d ".ai" ]; then ls -la .ai/; fi
      
      - name: "🔧 Configure Machine Git Automation Credentials"
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
      
      # Block 9.2: STRICT COMPLIANCE RAIL GATE - Native verification to protect repository code integrity
      - name: "☕ Setup Hard Compilation Gate - Enterprise OpenJDK 17 Environment"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: "🟢 Setup Hard Compilation Gate - Next.js Frontend Node 20 Runtime"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Block 9.3: Absolute Zero Error check validation run executions before remote commit permissions are unlocked
      - name: "🛡️ Execute Mandatory Strict Compilation Verification Audit Loops"
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        run: |
          echo "⚡ [STRICT AUDIT GATE] Verifying newly generated source code structure assets..."
          
          # Verification Part A: Validate backend project layers compile state cleanly
          if [ -f "./sources/backend/pom.xml" ]; then
            echo "☕ Auditing Quarkus backend compile targets via native maven wrapper checks..."
            cd ./sources/backend && mvn clean test-compile -Dquarkus.analytics.disabled=true
            cd ../..
          fi
          
          # Verification Part B: Validate frontend compilation structures cleanly
          if [ -f "./sources/frontend/package.json" ]; then
            echo "🟢 Auditing Next.js frontend tree allocations via production build compilation..."
            cd ./sources/frontend
            if [ ! -d "node_modules" ]; then npm install; fi
            npm run build
            cd ../..
          fi
          echo "🎉 [STRICT AUDIT SUCCESS] Daily code assets cleared compiler validations without structural failure rejections!"
      
      # Block 9.4: Atomically increments schedule indicators inside the localized branch configuration matrix
      - name: "🗄️ Save State Indicators and Commit Generated Workspace Assets Upstream"
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        env:
          EXEC_MODE: ${{ needs.state_resolver_job.outputs.exec_mode }}
          RUN_DAY: ${{ needs.state_resolver_job.outputs.run_day }}
          RUN_PHASE: ${{ needs.state_resolver_job.outputs.run_phase }}
          TOTAL_DAYS: ${{ needs.state_resolver_job.outputs.total_days }}
          TOTAL_PHASES: ${{ needs.state_resolver_job.outputs.total_phases }}
          BRANCH_NAME: "features/development"
        run: |
          STATE_FILE=".ai/.agents/.states/pipeline_state.json"
          
          #  update state
          echo "💾 [STATE SAVE] Serializing current matrix back to file tracking storage..."
          mkdir -p "$(dirname "$STATE_FILE")"
          echo "{\"exec_mode\": \"$EXEC_MODE\", \"current_day\": $RUN_DAY, \"total_days\": $TOTAL_DAYS, \"current_phase\": $RUN_PHASE, \"total_phases\": $TOTAL_PHASES}" > "$STATE_FILE"
          
          # merge state file
          git add "$STATE_FILE"
          
          # Only commit if there are explicit architectural diff changes detected
          if git diff --cached --quiet; then
              echo "⚠️ Operational Notice: No data state changes detected. Skipping repository commit."
          else
              echo "📝 Committing system state changes..."
              git commit -m "chore(pipeline): record cron incremental state to Phase $RESOLVED_PHASE Day $RESOLVED_DAY [AI Loop]" || true
              
              # ✅ ENTERPRISE HOTFIX: Pull new changes and rebase to avoid conflicts fast-forward
              echo "🔄 Checking if remote branch $BRANCH_NAME exists..."
              if git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
                  echo "🔄 Pulling latest upstream tree from $BRANCH_NAME and executing explicit contextual rebase..."
                  git pull --rebase -X theirs origin $BRANCH_NAME
              else
                  echo "ℹ️ Remote branch $BRANCH_NAME does not exist yet. Skipping rebase."
              fi
              
              echo "📤 Pushing secure data changes upstream to repository branch..."
              git push origin HEAD:"refs/heads/$BRANCH_NAME"
              echo "✨ [SUCCESS] Dynamic matrix pointers synchronized upstream!"
          fi
      
      # Block 9.5: 🔀🚀 Create Automated Pull Request to Main Development Trunk
      - name: "🔀🚀 Create Automated Pull Request to Main Development Trunk"
        working-directory: ${{ env.PROJECT_WORKSPACE }}
        env:
          GH_TOKEN: ${{ secrets.PAT_SECRETS_MANAGER }}
          SOURCE_BRANCH: 'features/development-phase-${{ needs.state_resolver_job.outputs.run_phase }}-day-${{ needs.state_resolver_job.outputs.run_day }}'
          TARGET_BRANCH: 'features/development'
          RUN_DAY: ${{ needs.state_resolver_job.outputs.run_day }}
          RUN_PHASE: ${{ needs.state_resolver_job.outputs.run_phase }}
        run: |
          echo "📣 Checking for existing Pull Requests from [ $SOURCE_BRANCH ] to [ $TARGET_BRANCH ]..."
          
          # 🔍 check whether existing PR
          PR_EXISTS=$(gh pr list --head "$SOURCE_BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number')
          
          if [ ! -z "$PR_EXISTS" ]; then
            echo "🌿 [ ALREADY EXISTS ] An active Pull Request (#$PR_EXISTS) already exists for this branch. Skipping creation."
          
          else
            # check whether exists any new commits
            NEW_COMMITS=$(git log origin/$TARGET_BRANCH..origin/$SOURCE_BRANCH --oneline)
            if [ -z "$NEW_COMMITS" ]; then
              echo "⚠️ [PR SKIPPED] Branch $SOURCE_BRANCH has no any new commits with $TARGET_BRANCH. Skip creating PR."

            else
              echo "🚀 [PR CREATION] Launching automated Pull Request generation protocols..."

              # 🔀 Create PR automatically
              gh pr create \
                --head "$SOURCE_BRANCH" \
                --base "$TARGET_BRANCH" \
                --title "chore(pipeline): merge integration for Phase $RUN_PHASE Day $RUN_DAY [AI Loop]" \
                --body "### 🤖 Automated Development Cycle Pull Request
                * **Origin Phase**: $RUN_PHASE
                * **Origin Day**: $RUN_DAY
                * **Target Core Trunk**: $TARGET_BRANCH
                
                This PR was automatically provisioned by the AI pipeline workspace loop to synchronize daily code increments back into the stable mainline trunk." \
                --reviewer "${{ github.repository_owner }}"
                
              echo "✅✨ [SUCCESS] Pull Request successfully staged upstream!"
            fi
          fi
